# Lemma Subnet Docker Compose
#
# For Validators: Use this file to run the validator with auto-updates
#
# Usage:
#   1. Copy this file to your server
#   2. Update NETUID and wallet configuration
#   3. Run: docker-compose up -d
#   4. View logs: docker-compose logs -f validator
#
# Watchtower will automatically update the validator when new images are pushed

services:
  validator:
    # For production: use the Docker Hub image
    # image: your-dockerhub-username/lemma-subnet:latest
    
    # For development: build locally
    build: .
    
    container_name: lemma-validator
    restart: unless-stopped
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    environment:
      # Network configuration
      - NETWORK=${NETWORK:-finney}
      - NETUID=${NETUID:-1}
      
      # Wallet configuration (keys are mounted as volume)
      - WALLET_NAME=${WALLET_NAME:-default}
      - HOTKEY_NAME=${HOTKEY_NAME:-default}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EMA_ALPHA=${EMA_ALPHA:-0.35}
      - MINER_REQUEST_TIMEOUT=${MINER_REQUEST_TIMEOUT:-45}
      - LEAN_TIMEOUT_SECONDS=${LEAN_TIMEOUT_SECONDS:-30}
      - MAX_RESPONSE_CHARS=${MAX_RESPONSE_CHARS:-16000}
      - MAX_PROOF_CHARS_FOR_SCORING=${MAX_PROOF_CHARS_FOR_SCORING:-12000}
      - MAX_PROOF_LINES=${MAX_PROOF_LINES:-300}
      - MAX_IMPORT_LINES=${MAX_IMPORT_LINES:-4}
      - CHALLENGE_BATCH_SIZE=${CHALLENGE_BATCH_SIZE:-6}
      - DIFFICULTY_WEIGHTING_ENABLED=${DIFFICULTY_WEIGHTING_ENABLED:-true}
      - LEAN_MEMORY_LIMIT_MB=${LEAN_MEMORY_LIMIT_MB:-1024}
      - COMMITMENT_REFRESH_BLOCKS=${COMMITMENT_REFRESH_BLOCKS:-20}
      - ROUND_LOG_PATH=${ROUND_LOG_PATH:-data/round_results.jsonl}
      - EPISTULA_SIGN_REQUESTS=${EPISTULA_SIGN_REQUESTS:-true}
      - EPISTULA_VERIFY_RESPONSES=${EPISTULA_VERIFY_RESPONSES:-true}
      - EPISTULA_STRICT_VERIFY=${EPISTULA_STRICT_VERIFY:-true}
      - EPISTULA_MAX_SKEW_SECONDS=${EPISTULA_MAX_SKEW_SECONDS:-60}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_HOST=${METRICS_HOST:-0.0.0.0}
      - METRICS_PORT=${METRICS_PORT:-9109}
      - MINER_ENDPOINTS=${MINER_ENDPOINTS:-}
    
    volumes:
      # Mount wallet directory (read-only for security)
      - ~/.bittensor/wallets:/root/.bittensor/wallets:ro
      
      # Persistent storage for validator state/scores
      - validator-data:/app/data
    
    # Metrics endpoint (Prometheus + JSON)
    ports:
      - "${METRICS_PORT:-9109}:${METRICS_PORT:-9109}"
    
    # Resource limits - adjust based on your hardware
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import bittensor; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    
    # Labels for Watchtower
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Watchtower - automatically updates containers when new images are available
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    
    environment:
      # Check for updates every 5 minutes (300 seconds)
      - WATCHTOWER_POLL_INTERVAL=300
      
      # Clean up old images after updating
      - WATCHTOWER_CLEANUP=true
      
      # Only update containers with the enable label
      - WATCHTOWER_LABEL_ENABLE=true
      
      # Rolling restart - graceful updates
      - WATCHTOWER_ROLLING_RESTART=true
      
      # Uncomment for Slack notifications
      # - WATCHTOWER_NOTIFICATIONS=slack
      # - WATCHTOWER_NOTIFICATION_SLACK_HOOK_URL=${SLACK_WEBHOOK_URL}
      # - WATCHTOWER_NOTIFICATION_SLACK_IDENTIFIER=${HOSTNAME:-lemma-validator}
    
    volumes:
      # Watchtower needs Docker socket access to manage containers
      - /var/run/docker.sock:/var/run/docker.sock
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  validator-data:
